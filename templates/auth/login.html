<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ERP Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1f3c88;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;

            box-sizing: border-box;

            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 12px;

            background: #1f3c88;
            color: white;

            border: none;
            border-radius: 5px;

            cursor: pointer;
        }

        button:hover {
            background: #162d68;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>ERP Login</h1>

        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <a class="home" href="/">
            ← Back to Home
        </a>

    </div>

</body>

</html>
