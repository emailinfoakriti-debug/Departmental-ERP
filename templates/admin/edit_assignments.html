
{% extends "base.html" %}

{% block content %}

<h2>Edit Assignment</h2>

<form method="POST">

    <label>Assignment Title</label>
    <input
        type="text"
        name="title"
        value="{{ record.title }}"
        required
    >

    <br><br>

    <label>Description</label>
    <textarea name="description" required>{{ record.description or '' }}</textarea>

    <br><br>

    <label>Select Subject</label>

    <select name="subject_id" required>

        <option value="">Select Subject</option>

        {% for s in subjects %}

        <option
            value="{{ s.id }}"
            {% if s.id == record.subject_id %}selected{% endif %}
        >
            {{ s.subject_code }} - {{ s.subject_name }}
        </option>

        {% endfor %}

    </select>

    <br><br>

    <label>Faculty Name</label>
    <input
        type="text"
        name="faculty_name"
        value="{{ record.faculty_name or '' }}"
    >

    <br><br>

    <label>Due Date</label>
    <input
        type="date"
        name="due_date"
        value="{{ record.due_date.strftime('%Y-%m-%d') }}"
        required
    >

    <br><br>

    <label>Total Marks</label>
    <input
        type="number"
        name="total_marks"
        min="0.01"
        step="0.01"
        value="{{ record.total_marks or 100 }}"
        required
    >

    <br><br>

    <button type="submit">Update Assignment</button>

    <a href="{{ url_for('assignments.view_assignments') }}">
        Cancel
    </a>

</form>

{% endblock %}
