
<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f4f8;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Edit Student Details</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Student ID</label>
        <input type="text" name="student_id"
               value="{{ student.student_id }}" required>

        <label>Roll Number</label>
        <input type="text" name="roll_no"
               value="{{ student.roll_no }}" required>

        <label>Name</label>
        <input type="text" name="name"
               value="{{ student.name }}" required>

        <label>Email</label>
        <input type="email" name="email"
               value="{{ student.email }}" required>

        <label>Phone</label>
        <input type="text" name="phone"
               value="{{ student.phone or '' }}">

        <label>Course</label>
        <input type="text" name="course"
               value="{{ student.course or '' }}">

        <label>Semester</label>
        <select name="semester">
            <option value="">Select Semester</option>
            {% for i in range(1, 9) %}
                <option value="{{ i }}"
                    {% if student.semester == i %}selected{% endif %}>
                    Semester {{ i }}
                </option>
            {% endfor %}
        </select>

        <label>Section</label>
        <input type="text" name="section"
               value="{{ student.section or '' }}">

        <button type="submit">Update Student</button>

    </form>

    <br>
    <a href="{{ url_for('students.view_students') }}">Back</a>

</div>

</body>
</html>
