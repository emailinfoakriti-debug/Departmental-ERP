
{% extends "base.html" %}

{% block content %}

<h2>Add Student Marks</h2>

<form method="POST">

    <label>Select Student</label>
    <select name="student_id" required>
        <option value="">Select Student</option>
        {% for s in students %}
        <option value="{{ s.id }}">
            {{ s.student_id }} - {{ s.name }}
        </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Select Subject</label>
    <select name="subject_id" required>
        <option value="">Select Subject</option>
        {% for s in subjects %}
        <option value="{{ s.id }}">
            {{ s.subject_code }} - {{ s.subject_name }}
        </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Exam Name</label>
    <input type="text" name="exam_name"
           placeholder="Example: Internal Examination"
           required>

    <br><br>

    <label>Assignment Marks</label>
    <input type="number" name="assignment_marks"
           min="0" step="0.01" value="0" required>

    <br><br>

    <label>Internal Marks</label>
    <input type="number" name="internal_marks"
           min="0" step="0.01" value="0" required>

    <br><br>

    <label>Practical Marks</label>
    <input type="number" name="practical_marks"
           min="0" step="0.01" value="0" required>

    <br><br>

    <button type="submit">Save Marks</button>

</form>

{% endblock %}
