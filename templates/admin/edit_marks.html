
{% extends "base.html" %}

{% block content %}

<h2>Edit Student Marks</h2>

<form method="POST">

    <label>Select Student</label>

    <select name="student_id" required>
        {% for s in students %}
        <option value="{{ s.id }}"
            {% if s.id == record.student_id %}selected{% endif %}>
            {{ s.student_id }} - {{ s.name }}
        </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Select Subject</label>

    <select name="subject_id" required>
        {% for s in subjects %}
        <option value="{{ s.id }}"
            {% if s.id == record.subject_id %}selected{% endif %}>
            {{ s.subject_code }} - {{ s.subject_name }}
        </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Exam Name</label>
    <input type="text" name="exam_name"
           value="{{ record.exam_name }}" required>

    <br><br>

    <label>Assignment Marks</label>
    <input type="number" name="assignment_marks"
           min="0" step="0.01"
           value="{{ record.assignment_marks or 0 }}" required>

    <br><br>

    <label>Internal Marks</label>
    <input type="number" name="internal_marks"
           min="0" step="0.01"
           value="{{ record.internal_marks or 0 }}" required>

    <br><br>

    <label>Practical Marks</label>
    <input type="number" name="practical_marks"
           min="0" step="0.01"
           value="{{ record.practical_marks or 0 }}" required>

    <br><br>

    <button type="submit">Update Marks</button>

    <a href="{{ url_for('marks.view_marks') }}">Cancel</a>

</form>

{% endblock %}
